<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>leynarry · 快速录入</title>
<style>
  :root {
    --bg:#f6f4f0; --card:#fff; --text:#2c2416; --muted:#8c7b6d;
    --accent:#5b8c5a; --warn:#c4843e; --danger:#c0504d;
    --border:#e8e2d9; --radius:14px; --shadow:0 1px 4px rgba(0,0,0,.05);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
    padding:12px 12px 88px; max-width:760px; margin:0 auto;
  }
  .top { display:flex; align-items:center; gap:8px; padding:6px 2px 12px; }
  .top h1 { font-size:1.05rem; font-weight:700; flex:none; }
  .top input[type=date] {
    flex:1; font-size:15px; font-family:inherit; color:var(--text);
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:8px 10px; min-height:40px; outline:none;
  }

  /* ── 折叠区 ── */
  .sec { background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
         box-shadow:var(--shadow); margin-bottom:10px; overflow:hidden; }
  .sh { display:flex; align-items:center; gap:10px; padding:14px; cursor:pointer; }
  .sh .ic { font-size:1.1rem; flex:none; }
  .sh .tx { flex:1; min-width:0; }
  .sh .ti { font-size:.92rem; font-weight:700; }
  .sh .sm { font-size:.74rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sh .sm.empty { color:#bfb3a6; }
  .sh .ar { color:var(--muted); font-size:.8rem; flex:none; transition:transform .18s; }
  .sec.open .sh .ar { transform:rotate(90deg); }
  .sb { display:none; padding:0 14px 14px; }
  .sec.open .sb { display:block; }

  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .fld { flex:1 1 104px; min-width:96px; }
  .fld label { display:block; font-size:.72rem; color:var(--muted); margin-bottom:3px; }
  input[type=text],input[type=number],input[type=time],textarea,select {
    width:100%; font-size:16px; font-family:inherit; color:var(--text);
    background:#fbfaf8; border:1px solid var(--border); border-radius:10px;
    padding:9px 10px; outline:none; min-height:40px;
  }
  input:focus,textarea:focus,select:focus { border-color:var(--accent); background:#fff; }
  input.miss { border-color:var(--danger); background:#fdf4f3; }
  textarea { resize:vertical; line-height:1.5; }
  .gt { font-size:.72rem; color:var(--muted); font-weight:600; margin:12px 0 6px; }
  .gt:first-child { margin-top:0; }

  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--border); background:#fff; border-radius:999px;
          padding:7px 12px; font-size:.8rem; font-family:inherit; color:var(--text);
          cursor:pointer; min-height:36px; }
  .chip:active { background:#f0ede7; }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chip.fat { border-color:#e2c9a3; background:#fdf8ef; }
  .chip.fat.on { background:var(--warn); color:#fff; border-color:var(--warn); }
  .chip.add { border-style:dashed; color:var(--muted); }
  .chip .x { margin-left:5px; opacity:.5; }

  /* ── 食材分组小标签 ── */
  .gtabs { display:flex; gap:4px; overflow-x:auto; padding-bottom:6px; margin-bottom:8px; }
  .gtab { flex:none; border:none; background:#f1ede6; color:var(--muted);
          border-radius:999px; padding:7px 13px; font-size:.78rem; font-weight:600;
          font-family:inherit; cursor:pointer; min-height:34px; white-space:nowrap; }
  .gtab.on { background:var(--accent); color:#fff; }

  .mealtabs { display:flex; gap:4px; background:#f1ede6; border-radius:12px; padding:4px; margin-bottom:10px; }
  .mealtab { flex:1; text-align:center; padding:9px 0; border-radius:9px; border:none; background:none;
             font-size:.82rem; font-weight:600; color:var(--muted); font-family:inherit; cursor:pointer; }
  .mealtab.on { background:var(--accent); color:#fff; }
  .mealtab .dot { font-size:.62rem; opacity:.85; }

  .items { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .item { background:#fbfaf8; border:1px solid var(--border); border-radius:10px; padding:6px 8px; }
  .itop { display:flex; align-items:center; gap:6px; }
  .itop .nm { flex:1; font-size:.86rem; font-weight:600; min-width:0; }
  .itop .nm .fm { color:var(--warn); font-size:.7rem; margin-left:3px; }
  .qty { width:56px; height:38px; min-height:38px; text-align:center; padding:2px; font-size:15px; font-weight:600; }
  .un { font-size:.75rem; color:var(--muted); min-width:18px; }
  .stp { width:38px; height:38px; border-radius:9px; border:1px solid var(--border);
         background:#fff; font-size:1.05rem; line-height:1; cursor:pointer; font-family:inherit; flex:none; color:var(--text); }
  .stp:active { background:#eee; }
  .del { border:none; background:none; color:var(--muted); font-size:1.05rem; width:38px; height:38px; cursor:pointer; flex:none; }
  .mrow { margin-top:5px; }
  .mbtn { border:1px dashed var(--border); background:none; color:var(--muted);
          border-radius:8px; padding:3px 9px; font-size:.72rem; font-family:inherit; cursor:pointer; min-height:28px; }
  .mbtn.set { border-style:solid; background:#fff; color:var(--text); font-weight:600; }
  .mbtn.oil { border-color:#e2c9a3; background:#fdf8ef; color:#8a6428; }
  .mpick { margin-top:6px; padding:8px; background:#fff; border:1px solid var(--border); border-radius:10px; }
  .item.dish { background:#f4f8f3; border-color:#cfe0cd; }
  .subs { margin:5px 0 0 4px; padding-left:9px; border-left:2px solid #cfe0cd; }
  .sub { display:flex; align-items:center; gap:5px; padding:2px 0; }
  .sub .sn { flex:1; font-size:.79rem; color:#4a5b48; min-width:0; }
  .sub .qty { width:50px; height:32px; min-height:32px; font-size:14px; }
  .sub .stp { width:32px; height:32px; }
  .sub .del { width:30px; height:32px; font-size:.95rem; }
  .dishbar { display:flex; align-items:center; gap:8px; background:#e9f2e8; border:1px solid #cfe0cd;
             border-radius:10px; padding:8px 10px; margin-bottom:8px; font-size:.78rem; color:#3d6b3c; }
  .dishbar b { font-weight:700; }
  .cks { display:flex; gap:16px; flex-wrap:wrap; margin-top:8px; }
  .cks label { display:flex; align-items:center; gap:7px; font-size:.76rem; color:var(--muted); padding:6px 0; cursor:pointer; }
  .cks input { width:22px; height:22px; min-height:22px; flex:none; }
  .dishbar button { margin-left:auto; border:none; background:var(--accent); color:#fff;
                    border-radius:8px; padding:6px 12px; font-size:.76rem; font-weight:700;
                    font-family:inherit; cursor:pointer; min-height:32px; flex:none; }

  .seg { border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:8px; background:#fbfaf8; }
  .seg .st { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  .seg .st .t { flex:1; font-size:.88rem; font-weight:700; }

  .banner { border-radius:10px; padding:9px 11px; font-size:.78rem; margin:10px 0 0; line-height:1.5; }
  .banner.bad { background:#fdf4f3; border:1px solid #e9c9c7; color:#8d3a37; }
  .banner.ok { background:#f2f7f1; border:1px solid #cfe0cd; color:#3d6b3c; }

  .out { font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; font-size:13px; min-height:200px; }
  .tip { font-size:.68rem; color:var(--muted); text-align:center; margin-top:6px; }

  .bar { position:fixed; left:0; right:0; bottom:0;
         padding:10px 12px calc(10px + env(safe-area-inset-bottom));
         background:rgba(246,244,240,.96); border-top:1px solid var(--border);
         display:flex; gap:8px; max-width:760px; margin:0 auto; }
  .btn { flex:1; padding:13px 0; border-radius:12px; border:none; font-family:inherit; font-size:.92rem; font-weight:700; cursor:pointer; }
  .btn.primary { background:var(--accent); color:#fff; }
  .btn.ghost { background:#fff; color:var(--muted); border:1px solid var(--border); flex:0 0 84px; }
  .btn:active { opacity:.85; }
</style>
</head>
<body>

<div class="top">
  <h1>🍱 录入</h1>
  <input type="date" id="date">
</div>

<div class="sec open" id="sec-food">
  <div class="sh" onclick="toggle('food')"><span class="ic">🍽️</span>
    <span class="tx"><span class="ti">饮食</span><br><span class="sm" id="sum-food"></span></span>
    <span class="ar">›</span></div>
  <div class="sb">
    <div class="mealtabs" id="mealtabs"></div>
    <div class="items" id="items"></div>
    <div id="dishBar"></div>
    <div class="gtabs" id="gtabs"></div>
    <div class="chips" id="palette"></div>
    <div class="mrow"><button class="mbtn" onclick="newDish()">🍲 ＋ 一道菜（多种食材）</button></div>
    <div class="gt">蔬果品种（选填，只记名字）</div>
    <input type="text" id="variety" placeholder="秋葵 生菜 蓝莓">
    <div class="gt">自己加一样（会进「我的常用」）</div>
    <div class="row">
      <div class="fld" style="flex:2 1 110px;"><input type="text" id="cName" placeholder="食物名"></div>
      <div class="fld" style="flex:0 0 68px;"><input type="number" inputmode="decimal" id="cQty" placeholder="量"></div>
      <div class="fld" style="flex:0 0 70px;"><select id="cUnit">
        <option value="g">g</option><option value="ml">ml</option><option value="个">个</option>
        <option value="片">片</option><option value="块">块</option><option value="颗">颗</option>
        <option value="根">根</option><option value="勺">勺</option><option value="杯">杯</option>
        <option value="份">份</option><option value="">无</option></select></div>
      <button class="stp" style="width:42px;" onclick="addCustom()">＋</button>
    </div>
    <div class="cks">
      <label><input type="checkbox" id="cFav"> ⭐ 加入常用</label>
    </div>
  </div>
</div>

<div class="sec" id="sec-ex">
  <div class="sh" onclick="toggle('ex')"><span class="ic">🏃</span>
    <span class="tx"><span class="ti">运动</span><br><span class="sm" id="sum-ex"></span></span>
    <span class="ar">›</span></div>
  <div class="sb">
    <div id="exList"></div>
    <div class="gt">加一段</div>
    <div class="chips" id="exChips"></div>
  </div>
</div>

<div class="sec" id="sec-body">
  <div class="sh" onclick="toggle('body')"><span class="ic">⚖️</span>
    <span class="tx"><span class="ti">身体</span><br><span class="sm" id="sum-body"></span></span>
    <span class="ar">›</span></div>
  <div class="sb">
    <div class="row">
      <div class="fld"><label>体重 kg</label><input type="number" inputmode="decimal" step="0.05" id="weight" placeholder="66.45"></div>
      <div class="fld"><label>饮水 L</label><input type="number" inputmode="decimal" step="0.1" id="water" placeholder="1.8"></div>
    </div>
    <div class="gt">睡眠</div>
    <div class="row">
      <div class="fld"><label>入睡</label><input type="time" id="sleepStart"></div>
      <div class="fld"><label>起床</label><input type="time" id="sleepEnd"></div>
      <div class="fld"><label>深睡 分钟</label><input type="number" inputmode="numeric" id="deep" placeholder="62"></div>
    </div>
    <div class="tip" id="sleepCalc" style="text-align:left;margin:6px 0 0;"></div>
    <div class="gt">睡眠备注（选填）</div>
    <input type="text" id="sleepNote" placeholder="午睡、夜醒、做梦…">
  </div>
</div>

<div class="sec" id="sec-more">
  <div class="sh" onclick="toggle('more')"><span class="ic">➕</span>
    <span class="tx"><span class="ti">更多</span><br><span class="sm" id="sum-more"></span></span>
    <span class="ar">›</span></div>
  <div class="sb">
    <div class="gt">💊 补剂 / 用药</div>
    <div class="chips" id="suppChips"></div>
    <div class="items" id="suppList" style="margin-top:8px;"></div>
    <div class="gt">🩸 生理期</div>
    <div class="chips" id="periodChips"></div>
    <div class="row" id="periodDetail" style="margin-top:8px;"></div>
    <div class="gt">📝 体感 / 症状</div>
    <textarea id="feel" rows="2" placeholder="没有就留空"></textarea>
    <div class="gt">其他补充（格式不限）</div>
    <textarea id="note" rows="3" placeholder="例：午饭外食没法称重，大概一碗"></textarea>
  </div>
</div>

<div class="sec open">
  <div class="sb" style="display:block;padding:14px;">
    <textarea class="out" id="out" rows="9" readonly placeholder="点下方「生成记录」"></textarea>
    <div class="tip" id="tip"></div>
  </div>
</div>

<div class="bar">
  <button class="btn ghost" onclick="clearDay()">清空</button>
  <button class="btn primary" onclick="genAndCopy()">生成记录并复制</button>
</div>

<script>
// ═══════════ 食材库 ═══════════
var FOODS = [
  { g:'蛋白', items:[
    {n:'水煮蛋',u:'个',d:1},{n:'蛋清',u:'个',d:1},{n:'基围虾',u:'个',d:2},
    {n:'牛肉',u:'片',d:2},{n:'鸡腿',u:'个',d:1},{n:'鸡胸肉',u:'g',d:80},
    {n:'鱼',u:'g',d:100},{n:'海参',u:'根',d:1},{n:'豆腐',u:'g',d:100},
    {n:'无糖豆浆',u:'ml',d:200},{n:'全脂牛奶',u:'ml',d:200},{n:'无糖酸奶',u:'g',d:100}]},
  { g:'主食', items:[
    {n:'杂粮饭',u:'g',d:60},{n:'糙米饭',u:'g',d:60},{n:'荞麦面',u:'g',d:100},
    {n:'玉米',u:'份',d:0.25},{n:'土豆',u:'片',d:2},{n:'紫薯',u:'块',d:2},
    {n:'红薯',u:'块',d:2},{n:'南瓜',u:'g',d:100},{n:'山药',u:'g',d:100},
    {n:'全麦馒头',u:'个',d:1}]},
  { g:'蔬果', items:[
    {n:'蔬菜',u:'份',d:1,label:'蔬菜 份'},{n:'蔬菜',u:'g',d:100,label:'蔬菜 克'},
    {n:'水果',u:'份',d:1,label:'水果 份'},{n:'水果',u:'g',d:100,label:'水果 克'}]},
  { g:'⭐脂肪', items:[
    {n:'橄榄油',u:'勺',d:1,fat:true},{n:'坚果',u:'g',d:20,fat:true},
    {n:'牛油果',u:'个',d:0.5,fat:true},{n:'三文鱼',u:'g',d:100,fat:true},
    {n:'奇亚籽',u:'勺',d:1,fat:true},{n:'整蛋黄',u:'个',d:1,fat:true}]},
  { g:'饮品', items:[
    {n:'黑咖啡',u:'杯',d:1},{n:'美式(去奶基)',u:'杯',d:1},{n:'淡茶',u:'杯',d:1}]}
];

// 做法：oil 0=无油 1=少油 2=多油
var METHODS = [
  {n:'清蒸',oil:0},{n:'水煮',oil:0},{n:'白灼',oil:0},{n:'生食',oil:0},
  {n:'卤/酱',oil:0},{n:'煮汤',oil:0},{n:'烤',oil:0},{n:'空气炸',oil:0},
  {n:'凉拌',oil:1},{n:'清炒',oil:1},{n:'蒜蓉炒',oil:1},{n:'煎',oil:1},
  {n:'红烧',oil:2},{n:'爆炒',oil:2},{n:'干煸',oil:2},{n:'油炸',oil:2}
];

var EX_TYPES = ['户外步行','室内爬坡','跑步机','力量训练','私教课','椭圆仪',
                '羽毛球','跳舞','游泳','骑行','超慢跑','家务','通勤步行','休息日'];
// 只有这些才需要选身体部位
var EX_STRENGTH = ['力量训练','私教课'];
function needsParts(t){ return EX_STRENGTH.indexOf(t) >= 0 || getLib(LS_SP).indexOf(t) >= 0; }
var EX_PARTS = ['腿','臀','背','胸','肩','肱二头肌','肱三头肌','核心','全身'];
var SUPPS = ['易善复','维生素D','Omega-3','复合维生素'];
var PERIODS = ['无','量少','量中','量多'];
var MEALS = [{k:'breakfast',o:'早',l:'早'},{k:'lunch',o:'午',l:'午'},
             {k:'afternoon',o:'加',l:'加餐'},{k:'dinner',o:'晚',l:'晚'}];

var LS='leynarry-log-', LS_F='leynarry-custom-foods', LS_E='leynarry-custom-ex',
    LS_S='leynarry-custom-supp', LS_P='leynarry-custom-part', LS_M='leynarry-custom-method',
    LS_SP='leynarry-strength-types';

var S=null, cur='breakfast', gsel=0, mpick=-1, open1='food', dish=-1;

// ═══════════ 工具 ═══════════
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function mins(t){var p=t.split(':');return (+p[0])*60+(+p[1]);}
function r2(x){return Math.round(x*100)/100;}
function getLib(k){try{return JSON.parse(localStorage.getItem(k))||[];}catch(e){return [];}}
function putLib(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function addLib(k,v,isObj){var L=getLib(k);for(var i=0;i<L.length;i++){if(isObj?(L[i].n===v.n&&L[i].u===v.u):(L[i]===v))return;}L.push(v);putLib(k,L);}
function rmLib(k,i){var L=getLib(k);L.splice(i,1);putLib(k,L);}
function methodOf(n){for(var i=0;i<METHODS.length;i++)if(METHODS[i].n===n)return METHODS[i];
  var L=getLib(LS_M);for(var i=0;i<L.length;i++)if(L[i].n===n)return L[i];return null;}

// ═══════════ 状态 ═══════════
function blank(d){return {date:d,weight:'',water:'',sleepStart:'',sleepEnd:'',deep:'',sleepNote:'',
  ex:[],meals:{breakfast:[],lunch:[],afternoon:[],dinner:[]},
  variety:{breakfast:'',lunch:'',afternoon:'',dinner:''},
  supp:[],period:'',periodDay:'',feel:'',note:''};}
function todayStr(){var t=new Date(),p=function(n){return (n<10?'0':'')+n;};
  return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate());}
function load(d){
  var b=blank(d);
  try{
    var raw=localStorage.getItem(LS+d);
    if(raw){
      var o=JSON.parse(raw);
      for(var k in b) if(!(k in o)||o[k]===null) o[k]=b[k];
      for(var i=0;i<MEALS.length;i++){var mk=MEALS[i].k;
        if(!o.meals||!o.meals[mk]){o.meals=o.meals||{};o.meals[mk]=[];}
        if(!o.variety||o.variety[mk]===undefined){o.variety=o.variety||{};o.variety[mk]='';}}
      if(!o.ex.length&&o.exType&&o.exType!=='无')
        o.ex=[{t:o.exType,parts:o.exParts||[],km:o.exKm||'',min:o.exMin||'',kcal:o.exKcal||''}];
      return o;
    }
  }catch(e){}
  return b;
}
function save(){
  try{ localStorage.setItem(LS+S.date,JSON.stringify(S));
    document.getElementById('tip').textContent='草稿已存 '+new Date().toTimeString().slice(0,5);
  }catch(e){ document.getElementById('tip').textContent='⚠️ 本地保存不可用，生成后请尽快复制'; }
}

// ═══════════ 折叠 ═══════════
function toggle(k){
  open1 = (open1===k) ? '' : k;
  ['food','ex','body','more'].forEach(function(x){
    document.getElementById('sec-'+x).classList[open1===x?'add':'remove']('open');
  });
}
function sums(){
  var n=0; for(var i=0;i<MEALS.length;i++) n+=S.meals[MEALS[i].k].length;
  var mp=[]; for(var i=0;i<MEALS.length;i++){var c=S.meals[MEALS[i].k].length; if(c) mp.push(MEALS[i].o+c);}
  setSum('food', n? mp.join('  ')+'　共'+n+'项' : '还没记');

  var kc=0,ok=false; for(var i=0;i<S.ex.length;i++){ if(S.ex[i].kcal) kc+=(+S.ex[i].kcal); ok=true; }
  setSum('ex', S.ex.length? S.ex.length+'段'+(kc?'　'+kc+' kcal':'') : '还没记');

  var b=[]; if(S.weight)b.push(S.weight+'kg'); if(S.water)b.push(S.water+'L');
  if(S.sleepStart&&S.sleepEnd){var m=mins(S.sleepEnd)-mins(S.sleepStart); if(m<0)m+=1440;
    b.push(Math.floor(m/60)+'h'+(m%60)+'m');}
  setSum('body', b.length? b.join('　') : '还没记');

  var mo=[]; for(var i=0;i<S.supp.length;i++) mo.push(S.supp[i].n);
  if(S.period) mo.push('🩸'+S.period);

// ═══════════ 生成 ═══════════
function fmtQ(o){
  if(o.n==='玉米'&&o.u==='份'){var mp={0.25:'¼',0.5:'½',0.75:'¾',1:'1'};return '玉米'+(mp[o.q]||o.q+'份');}
  if(o.q===''||o.q===undefined) return o.n;
  if(isNaN(parseFloat(o.q))) return o.n+o.q;
  return o.n+o.q+o.u;
}
function fmtItem(it){
  var s=fmtQ(it);
  if(it.m){ var m=methodOf(it.m); s+='('+it.m+(m&&m.oil==2?'·多油':(m&&m.oil==1?'·少油':''))+')'; }
  if(it.sub){
    var ps=[]; for(var i=0;i<it.sub.length;i++) ps.push(fmtQ(it.sub[i]));
    s+='['+(ps.length?ps.join('+'):'未填食材')+']';
  }
  return s;
}
function fmtEx(e){
  if(e.t==='休息日') return '休息日';
  var p=[]; if(e.km)p.push(e.km+'km'); if(e.min)p.push(e.min+'min'); if(e.kcal)p.push(e.kcal+'kcal');
  return e.t+(e.parts.length?'（'+e.parts.join('+')+'）':'')+(p.length?' '+p.join('/'):'');
}
function build(){
  var L=[],miss=[],d=S.date.split('-');
  var wk=['周日','周一','周二','周三','周四','周五','周六'][new Date(S.date+'T12:00:00').getDay()];
  L.push((+d[1])+'/'+(+d[2])+'（'+wk+'）');
  if(!S.weight)miss.push('体重'); if(!S.water)miss.push('饮水');
  L.push('体 '+(S.weight?S.weight+'kg':'—')+'　水 '+(S.water?S.water+'L':'—'));
  if(S.sleepStart&&S.sleepEnd){
    var m=mins(S.sleepEnd)-mins(S.sleepStart); if(m<0)m+=1440;
    L.push('睡 '+S.sleepStart+'-'+S.sleepEnd+'（'+Math.floor(m/60)+'h'+(m%60)+'min）'+
      (S.deep?' 深'+S.deep:' 深—')+(S.sleepNote.trim()?'　'+S.sleepNote.trim():''));
  } else {miss.push('睡眠');L.push('睡 —');}
  if(!S.ex.length){miss.push('运动');L.push('动 —');}
  else{var sg=[];for(var i=0;i<S.ex.length;i++)sg.push(fmtEx(S.ex[i]));L.push('动 '+sg.join('  ｜  '));}
  for(var i=0;i<MEALS.length;i++){
    var m=MEALS[i],l=S.meals[m.k],ps=[];
    for(var j=0;j<l.length;j++)ps.push(fmtItem(l[j]));
    var line=m.o+' '+(ps.length?ps.join(' '):'—');
    var v=(S.variety[m.k]||'').trim(); if(v)line+='　｜品种 '+v;
    L.push(line);
  }
  // 只列出确定用了油的做法，不做「有没有脂肪源」的判断（那个交给 Claude）
  var oils=[];
  for(var i=0;i<MEALS.length;i++){var l=S.meals[MEALS[i].k];
    for(var j=0;j<l.length;j++){
      var mm=l[j].m?methodOf(l[j].m):null;
      if(mm&&mm.oil>0) oils.push(l[j].n+'('+l[j].m+(mm.oil==2?'·多油':'·少油')+')');
    }}
  if(oils.length) L.push('油 '+oils.join(' '));
  if(S.supp.length){var sp=[];for(var i=0;i<S.supp.length;i++)sp.push(S.supp[i].n+(S.supp[i].d?' '+S.supp[i].d:''));L.push('药 '+sp.join('　'));}
  if(S.period) L.push('🩸 '+S.period+(S.periodDay?'（第'+S.periodDay+'天）':''));
  L.push('感 '+(S.feel.trim()||'—'));
  if(S.note.trim()) L.push('补充 '+S.note.trim());
  if(miss.length) L.push('（未填：'+miss.join('、')+'）');
  return {text:L.join('\n'),miss:miss};
}
function genAndCopy(){
  var r=build(),out=document.getElementById('out');
  out.value=r.text;
  for(var i=0;i<SIMPLE.length;i++)document.getElementById(SIMPLE[i]).classList.remove('miss');
  var mp={'体重':'weight','饮水':'water','睡眠':'sleepStart'};
  for(var i=0;i<r.miss.length;i++) if(mp[r.miss[i]]) document.getElementById(mp[r.miss[i]]).classList.add('miss');
  save();
  var done=function(ok){
    document.getElementById('tip').textContent = ok?'✅ 已复制，直接粘给 Claude':'⚠️ 自动复制不可用 —— 长按上面的文本框全选复制';
    if(!ok){out.focus();out.select();}};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(r.text).then(function(){done(true);},function(){legacy(out,done);});
    else legacy(out,done);
  }catch(e){legacy(out,done);}
  out.scrollIntoView({behavior:'smooth',block:'center'});
}
function legacy(out,done){
  try{out.removeAttribute('readonly');out.focus();out.select();out.setSelectionRange(0,99999);
    var ok=document.execCommand('copy');out.setAttribute('readonly','readonly');done(ok);}catch(e){done(false);}
}

S=load(todayStr()); bind(); wire(); renderAll();
</script>
